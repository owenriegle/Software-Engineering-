# This is a basic workflow to help you get started with Actions

name: checkstyle

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# The checkstyle job
jobs:
  build:
    name: Checkstyle
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Set up the environment
      - name: Env setup
        run: | 
          mkdir -p /opt/lib
          wget -q -O /opt/lib/checkstyle.jar https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.12.6/checkstyle-10.12.6-all.jar
          cd "${GITHUB_WORKSPACE}"

      - name: Start Checkstyle Group
        run: echo "::group::Running Checkstyle"
          
      # Configures and runs checkstyle
      - name: Run Checkstyle
        run: |
          exec java -jar /opt/lib/checkstyle.jar "." -c "checkstyle_checks.xml" -f xml > results.xml

      - name: Reviewdog (Checkstyle)
        uses: reviewdog/action-reviewdog@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          level: warning
          tool_name: checkstyle
          input: results.xml
          format: checkstyle

      - name: Print Results (Colorized)
        run: |
          sed -e 's/error/\x1b[31merror\x1b[0m/g' \
              -e 's/warning/\x1b[33mwarning\x1b[0m/g' results.xml


      - name: End Checkstyle Group
        run: echo "::endgroup::"

      - name: Check Results
        run:  |
          if grep -q error results.xml; then
            echo "Checkstyle found an error - look at the logs under Print Results for details"
            exit 1
          else
            echo "No errors found!"
          fi
